openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Multi-tenant commission system API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tenants
    description: Tenant management
  - name: people
    description: Mirrored people records
  - name: jobs
    description: Mirrored job records
  - name: schema
    description: Tenant schema mapping
  - name: rules
    description: Rule module library and plans
  - name: commissions
    description: Commission ledger
  - name: insights
    description: Dashboard summaries and activity
  - name: manualInputs
    description: Manually-entered rep targets (quota, OTE, accelerators)
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: access
    description: User access and role management (RBAC)
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /me:
    get:
      tags: [access]
      operationId: getAuthContext
      summary: Get the current user's roles, memberships, and accessible tenants
      responses:
        "200":
          description: Resolved RBAC context for the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthContext"
  /users:
    get:
      tags: [access]
      operationId: listUsers
      summary: List all authenticated users (platform operator only)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthUser"
        "403":
          $ref: "#/components/responses/Forbidden"
  /tenants/{tenantId}/members:
    get:
      tags: [access]
      operationId: listTenantMembers
      summary: List memberships for a tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Membership"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [access]
      operationId: createTenantMember
      summary: Assign a user as an admin or rep for the tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipInput"
      responses:
        "200":
          description: Created membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /tenants/{tenantId}/members/{membershipId}:
    patch:
      tags: [access]
      operationId: updateTenantMember
      summary: Update a membership's role or linked person
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/MembershipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipUpdate"
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [access]
      operationId: deleteTenantMember
      summary: Remove a membership
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/MembershipId"
      responses:
        "200":
          description: Deleted membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMembershipResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /operators:
    get:
      tags: [access]
      operationId: listOperators
      summary: List Boolean operators (operator only)
      responses:
        "200":
          description: Platform operator memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Membership"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [access]
      operationId: createOperator
      summary: Grant a user Boolean Admin access (Boolean Super Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorInput"
      responses:
        "200":
          description: Created operator membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /operators/{membershipId}:
    delete:
      tags: [access]
      operationId: deleteOperator
      summary: Revoke a user's Boolean Admin access (Boolean Super Admin only)
      parameters:
        - $ref: "#/components/parameters/MembershipId"
      responses:
        "200":
          description: Deleted operator membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMembershipResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List all tenants
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create a new company (tenant)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenant"
      responses:
        "200":
          description: Created tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"

  /tenants/{tenantId}:
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Get a tenant by id
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTenant
      tags: [tenants]
      summary: Rename a company (tenant)
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenant"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTenant
      tags: [tenants]
      summary: Delete a company and all of its dependent data
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteTenantResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/dashboard:
    get:
      operationId: getDashboard
      tags: [insights]
      summary: Dashboard summary for a tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /tenants/{tenantId}/activity:
    get:
      operationId: getActivity
      tags: [insights]
      summary: Recent ledger activity for a tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /tenants/{tenantId}/payroll:
    get:
      operationId: getPayrollSummary
      tags: [insights]
      summary: Payroll summary grouped by person
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Payroll summary lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayrollLine"

  /tenants/{tenantId}/reconciliation:
    get:
      operationId: getReconciliation
      tags: [insights]
      summary: Reconcile computed commission totals against the data-source benchmark
      description: >-
        Compares our engine-computed per-person commission totals (Net Owed,
        Total Earned, Paid, Adjustments) against the reference "benchmark"
        figures pulled from the tenant's data source. Benchmark values are
        reference-only and never feed the engine, ledger, dashboard, or payroll.
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Reconciliation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationReport"

  /tenants/{tenantId}/people:
    get:
      operationId: listPeople
      tags: [people]
      summary: List mirrored people for a tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: People records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"

  /tenants/{tenantId}/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List mirrored jobs for a tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Job records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /tenants/{tenantId}/manual-inputs:
    get:
      operationId: listManualInputs
      tags: [manualInputs]
      summary: List manual inputs (quota/OTE/targets) for a tenant and period
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: periodType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PeriodType"
        - name: periodKey
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Manual input records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualInput"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: upsertManualInput
      tags: [manualInputs]
      summary: Create or update a rep's manual input for a period
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualInputInput"
      responses:
        "200":
          description: Upserted manual input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualInput"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tenants/{tenantId}/manual-inputs/{manualInputId}:
    delete:
      operationId: deleteManualInput
      tags: [manualInputs]
      summary: Delete (clear) a rep's manual input
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ManualInputId"
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteManualInputResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/manual-inputs/{manualInputId}/events:
    get:
      operationId: getManualInputEvents
      tags: [manualInputs]
      summary: Audit history for a manual input
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ManualInputId"
      responses:
        "200":
          description: Manual input audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualInputEvent"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/manual-input-variables:
    get:
      operationId: getManualInputVariables
      tags: [manualInputs]
      summary: Resolved manual-input named variables per person for a period
      description: >-
        Exposes manual inputs as named variables (quota, ote,
        acceleratorThreshold, acceleratorMultiplier) keyed by person, for the
        computation/dashboard layer to compute attainment and forecasts.
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: periodType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PeriodType"
        - name: periodKey
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Named variables per person
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualInputVariables"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tenants/{tenantId}/schema-mapping:
    get:
      operationId: getSchemaMapping
      tags: [schema]
      summary: Get the tenant's Airtable schema mapping
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Schema mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaMapping"
    put:
      operationId: updateSchemaMapping
      tags: [schema]
      summary: Update the tenant's Airtable schema mapping
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaMappingInput"
      responses:
        "200":
          description: Updated schema mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaMapping"

  /tenants/{tenantId}/positions:
    get:
      operationId: listPositions
      tags: [positions]
      summary: List the tenant's configured positions
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"
    post:
      operationId: createPosition
      tags: [positions]
      summary: Add a position to the tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionInput"
      responses:
        "200":
          description: Created position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"
        "400":
          $ref: "#/components/responses/BadRequest"

  /tenants/{tenantId}/positions/{positionId}:
    patch:
      operationId: updatePosition
      tags: [positions]
      summary: Rename a position
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PositionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionInput"
      responses:
        "200":
          description: Updated position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePosition
      tags: [positions]
      summary: Delete a position
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PositionId"
      responses:
        "200":
          description: Deleted position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePositionResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /rule-modules:
    get:
      operationId: listRuleModules
      tags: [rules]
      summary: List the available rule modules in the library
      responses:
        "200":
          description: Rule module catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuleModule"

  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List the available data-source providers
      responses:
        "200":
          description: Data-source provider catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProviders"

  /tenants/{tenantId}/plan:
    get:
      operationId: getActivePlan
      tags: [rules]
      summary: Get the tenant's active commission plan
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Active plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionPlan"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/rule-instances:
    post:
      operationId: createRuleInstance
      tags: [rules]
      summary: Add a rule instance to the tenant's plan (creating the plan if needed)
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInstanceCreate"
      responses:
        "200":
          description: Updated plan including the new rule instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionPlan"
        "400":
          $ref: "#/components/responses/BadRequest"

  /tenants/{tenantId}/rule-instances/reorder:
    post:
      operationId: reorderRuleInstances
      tags: [rules]
      summary: Set the order of rule instances within the tenant's plan
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRuleInstances"
      responses:
        "200":
          description: Updated plan in the new order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /rule-instances/{ruleInstanceId}:
    patch:
      operationId: updateRuleInstance
      tags: [rules]
      summary: Update a rule instance's params or enabled state
      parameters:
        - name: ruleInstanceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInstanceUpdate"
      responses:
        "200":
          description: Updated rule instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleInstance"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteRuleInstance
      tags: [rules]
      summary: Remove a rule instance from its plan
      parameters:
        - name: ruleInstanceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Rule instance removed
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/recompute:
    post:
      operationId: recomputeCommissions
      tags: [commissions]
      summary: Run a full commission computation pass for the tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Recompute result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecomputeResult"

  /airtable/bases:
    get:
      operationId: listAirtableBases
      tags: [airtable]
      summary: List Airtable bases reachable through the connection
      responses:
        "200":
          description: Bases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AirtableBase"
        "502":
          $ref: "#/components/responses/BadRequest"

  /airtable/bases/{baseId}/tables:
    get:
      operationId: getAirtableTables
      tags: [airtable]
      summary: List the tables and fields of an Airtable base
      parameters:
        - name: baseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AirtableTable"
        "502":
          $ref: "#/components/responses/BadRequest"

  /tenants/{tenantId}/airtable-base:
    put:
      operationId: setAirtableBase
      tags: [airtable]
      summary: Point the tenant at an Airtable base
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAirtableBaseInput"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/sync:
    post:
      operationId: syncFromAirtable
      tags: [airtable]
      summary: Pull people and jobs from Airtable, then recompute
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /tenants/{tenantId}/commissions:
    get:
      operationId: listCommissions
      tags: [commissions]
      summary: List commission ledger entries for a tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CommissionState"
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CommissionType"
        - name: personId
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Commission entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommissionEntry"

  /commissions/{entryId}:
    get:
      operationId: getCommission
      tags: [commissions]
      summary: Get a single commission entry
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: Commission entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionEntry"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: adjustCommission
      tags: [commissions]
      summary: Adjust a commission entry amount or notes
      parameters:
        - $ref: "#/components/parameters/EntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionAdjustment"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionEntry"
        "404":
          $ref: "#/components/responses/NotFound"

  /commissions/{entryId}/transition:
    post:
      operationId: transitionCommission
      tags: [commissions]
      summary: Transition a commission entry to a new lifecycle state
      parameters:
        - $ref: "#/components/parameters/EntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionTransition"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /commissions/{entryId}/events:
    get:
      operationId: getCommissionEvents
      tags: [commissions]
      summary: Get the audit log for a commission entry
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommissionEvent"

components:
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
    PositionId:
      name: positionId
      in: path
      required: true
      schema:
        type: string
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
    ManualInputId:
      name: manualInputId
      in: path
      required: true
      schema:
        type: string
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Operation not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    MembershipRole:
      type: string
      enum: [super_operator, platform_operator, admin, rep]

    Membership:
      type: object
      required: [id, userId, role, tenantId, personId, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        role:
          $ref: "#/components/schemas/MembershipRole"
        tenantId:
          type: [string, 'null']
        personId:
          type: [string, 'null']
        createdAt:
          type: string
        userEmail:
          type: [string, 'null']
        userName:
          type: [string, 'null']
        personName:
          type: [string, 'null']

    MembershipInput:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
        role:
          type: string
          enum: [admin, rep]
        personId:
          type: [string, 'null']

    MembershipUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [admin, rep]
        personId:
          type: [string, 'null']

    OperatorInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: string

    DeleteMembershipResult:
      type: object
      required: [id, deleted]
      properties:
        id:
          type: string
        deleted:
          type: boolean

    AccessibleTenant:
      type: object
      required: [id, name, slug, role]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        role:
          $ref: "#/components/schemas/MembershipRole"

    AuthContext:
      type: object
      required:
        [
          user,
          isSuperOperator,
          isPlatformOperator,
          memberships,
          accessibleTenants,
        ]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
        isSuperOperator:
          type: boolean
        isPlatformOperator:
          type: boolean
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        accessibleTenants:
          type: array
          items:
            $ref: "#/components/schemas/AccessibleTenant"

    Position:
      type: object
      required: [id, tenantId, name, createdAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        createdAt:
          type: string

    PositionInput:
      type: object
      required: [name]
      properties:
        name:
          type: string

    DeletePositionResult:
      type: object
      required: [id, deleted]
      properties:
        id:
          type: string
        deleted:
          type: boolean

    PeriodType:
      type: string
      enum: [monthly, quarterly, annual]

    ManualInput:
      type: object
      required: [id, tenantId, personId, periodType, periodKey, effectiveFrom, effectiveTo, createdAt, updatedAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        personId:
          type: string
        periodType:
          $ref: "#/components/schemas/PeriodType"
        periodKey:
          type: string
        quota:
          type: ["number", "null"]
        ote:
          type: ["number", "null"]
        acceleratorThreshold:
          type: ["number", "null"]
        acceleratorMultiplier:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]
        effectiveFrom:
          type: string
        effectiveTo:
          type: string
        updatedBy:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    ManualInputInput:
      type: object
      required: [personId, periodType, periodKey]
      properties:
        personId:
          type: string
        periodType:
          $ref: "#/components/schemas/PeriodType"
        periodKey:
          type: string
        quota:
          type: ["number", "null"]
        ote:
          type: ["number", "null"]
        acceleratorThreshold:
          type: ["number", "null"]
        acceleratorMultiplier:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]

    DeleteManualInputResult:
      type: object
      required: [id, deleted]
      properties:
        id:
          type: string
        deleted:
          type: boolean

    ManualInputVariables:
      type: object
      required: [personId, personName]
      properties:
        personId:
          type: string
        personName:
          type: string
        quota:
          type: ["number", "null"]
        ote:
          type: ["number", "null"]
        acceleratorThreshold:
          type: ["number", "null"]
        acceleratorMultiplier:
          type: ["number", "null"]

    ManualInputEvent:
      type: object
      required: [id, manualInputId, tenantId, personId, eventKind, actor, at]
      properties:
        id:
          type: string
        manualInputId:
          type: string
        tenantId:
          type: string
        personId:
          type: string
        eventKind:
          type: string
        before:
          type: ["object", "null"]
          additionalProperties: true
        after:
          type: ["object", "null"]
          additionalProperties: true
        actor:
          type: string
        at:
          type: string

    CommissionState:
      type: string
      enum: [accrued, payable, paid, clawed_back, voided, disputed]

    CommissionType:
      type: string
      enum: [SL, SM, PM, PMM, REF, MSC, ADJ, PAY, ARB]

    EntityKind:
      type: string
      enum: [person, job, project, addendum]

    Tenant:
      type: object
      required: [id, name, slug, status, dataSourceProvider, airtableConnected, requiredFieldsMapped, peopleCount, jobsCount, entryCount, createdAt]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [active, paused]
        dataSourceProvider:
          type: string
          description: Key of the data-source provider this tenant ingests from (e.g. "airtable").
        airtableBaseId:
          type: ["string", "null"]
        airtableConnected:
          type: boolean
        requiredFieldsMapped:
          type: boolean
          description: True when every entity has a source table chosen and all required fields are mapped.
        peopleCount:
          type: integer
        jobsCount:
          type: integer
        entryCount:
          type: integer
        createdAt:
          type: string

    Person:
      type: object
      required: [id, tenantId, name, roles, active]
      properties:
        id:
          type: string
        tenantId:
          type: string
        airtableRecordId:
          type: ["string", "null"]
        name:
          type: string
        roles:
          type: array
          items:
            type: string
        position:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        company:
          type: ["string", "null"]
        ytdSales:
          type: ["number", "null"]
        startDate:
          type: ["string", "null"]
        active:
          type: boolean

    Job:
      type: object
      required: [id, tenantId, jobNumber, status, cancelled]
      properties:
        id:
          type: string
        tenantId:
          type: string
        airtableRecordId:
          type: ["string", "null"]
        jobNumber:
          type: string
        jobName:
          type: ["string", "null"]
        customer:
          type: ["string", "null"]
        salesRep:
          type: ["string", "null"]
        manager:
          type: ["string", "null"]
        totalAmount:
          type: ["number", "null"]
        gpAmount:
          type: ["number", "null"]
        gpPct:
          type: ["number", "null"]
        status:
          type: string
        cancelled:
          type: boolean
        leadSource:
          type: ["string", "null"]
        signedDate:
          type: ["string", "null"]
        completedDate:
          type: ["string", "null"]

    FieldMapping:
      type: object
      required: [canonical, label, required, mapped]
      properties:
        canonical:
          type: string
        label:
          type: string
        required:
          type: boolean
        mapped:
          type: boolean
        sourceFieldId:
          type: ["string", "null"]
        sourceFieldName:
          type: ["string", "null"]

    EntityMapping:
      type: object
      required: [entityKind, label, fields, unrecognizedFields]
      properties:
        entityKind:
          $ref: "#/components/schemas/EntityKind"
        label:
          type: string
        tableId:
          type: ["string", "null"]
        tableName:
          type: ["string", "null"]
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldMapping"
        unrecognizedFields:
          type: array
          items:
            type: string

    SchemaMapping:
      type: object
      required: [tenantId, provider, entities]
      properties:
        tenantId:
          type: string
        provider:
          type: string
          description: Data-source provider the source object/field references are interpreted against.
        entities:
          type: array
          items:
            $ref: "#/components/schemas/EntityMapping"

    ProviderInfo:
      type: object
      required: [key, label, available]
      properties:
        key:
          type: string
        label:
          type: string
        available:
          type: boolean
          description: False for providers listed as "coming soon" with no concrete implementation yet.

    ListProviders:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/ProviderInfo"

    SchemaMappingInput:
      type: object
      required: [entities]
      properties:
        entities:
          type: array
          items:
            $ref: "#/components/schemas/EntityMapping"

    FieldDef:
      type: object
      required: [key, label, type]
      properties:
        key:
          type: string
        label:
          type: string
        type:
          type: string
          enum:
            [number, percent, currency, text, select, multiselect, stringlist, list, position]
        help:
          type: ["string", "null"]
        min:
          type: ["number", "null"]
        max:
          type: ["number", "null"]
        step:
          type: ["number", "null"]
        nullable:
          type: ["boolean", "null"]
        placeholder:
          type: ["string", "null"]
        options:
          type: ["array", "null"]
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: string
              label:
                type: string
        itemFields:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/FieldDef"

    RuleModule:
      type: object
      required: [key, name, category, description, summary, builder, fields, defaultParams]
      properties:
        key:
          type: string
        name:
          type: string
        category:
          type: string
        description:
          type: string
        summary:
          type: string
        builder:
          type: string
          enum: [fields, custom]
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldDef"
        defaultParams:
          type: object
          additionalProperties: true

    RuleInstance:
      type: object
      required: [id, planId, ruleModuleKey, ruleModuleName, description, params, appliesTo, enabled, order]
      properties:
        id:
          type: string
        planId:
          type: string
        ruleModuleKey:
          type: string
        ruleModuleName:
          type: string
        description:
          type: string
        params:
          type: object
          additionalProperties: true
        appliesTo:
          $ref: "#/components/schemas/RuleAppliesTo"
        enabled:
          type: boolean
        order:
          type: integer

    RuleAppliesTo:
      type: object
      description: >-
        Cross-cutting targeting/exclusion config applied to a rule instance
        regardless of its module. A job is skipped for this rule when its sales
        rep or manager is named in excludePeople, or has a role/position listed
        in excludeRoles.
      properties:
        excludePeople:
          type: array
          items:
            type: string
        excludeRoles:
          type: array
          items:
            type: string
      additionalProperties: true

    RuleInstanceUpdate:
      type: object
      properties:
        params:
          type: object
          additionalProperties: true
        appliesTo:
          $ref: "#/components/schemas/RuleAppliesTo"
        enabled:
          type: boolean

    CreateTenant:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    UpdateTenant:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    DeleteTenantResult:
      type: object
      required: [id, deleted]
      properties:
        id:
          type: string
        deleted:
          type: boolean

    RuleInstanceCreate:
      type: object
      required: [ruleModuleKey]
      properties:
        ruleModuleKey:
          type: string
        name:
          type: string
        description:
          type: string
        params:
          type: object
          additionalProperties: true
        appliesTo:
          $ref: "#/components/schemas/RuleAppliesTo"
        enabled:
          type: boolean

    ReorderRuleInstances:
      type: object
      required: [orderedIds]
      properties:
        orderedIds:
          type: array
          items:
            type: string

    CommissionPlan:
      type: object
      required: [id, tenantId, name, effectiveFrom, ruleInstances]
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        effectiveFrom:
          type: string
        effectiveTo:
          type: ["string", "null"]
        ruleInstances:
          type: array
          items:
            $ref: "#/components/schemas/RuleInstance"

    CommissionEntry:
      type: object
      required: [id, tenantId, personId, personName, type, sourceKind, amount, currency, state, createdAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        personId:
          type: string
        personName:
          type: string
        type:
          $ref: "#/components/schemas/CommissionType"
        sourceKind:
          type: string
        sourceId:
          type: ["string", "null"]
        sourceLabel:
          type: ["string", "null"]
        amount:
          type: number
        currency:
          type: string
        state:
          $ref: "#/components/schemas/CommissionState"
        positionAtCosted:
          type: ["string", "null"]
        ruleInstanceIds:
          type: array
          items:
            type: string
        computationSnapshot:
          type: ["object", "null"]
          additionalProperties: true
        notes:
          type: ["string", "null"]
        accruedAt:
          type: ["string", "null"]
        payableAt:
          type: ["string", "null"]
        paidAt:
          type: ["string", "null"]
        clawedBackAt:
          type: ["string", "null"]
        createdAt:
          type: string

    CommissionAdjustment:
      type: object
      properties:
        amount:
          type: number
        notes:
          type: string

    CommissionTransition:
      type: object
      required: [toState]
      properties:
        toState:
          $ref: "#/components/schemas/CommissionState"
        notes:
          type: string

    CommissionEvent:
      type: object
      required: [id, entryId, eventKind, actor, at]
      properties:
        id:
          type: string
        entryId:
          type: string
        eventKind:
          type: string
          enum: [created, recomputed, state_change, manually_adjusted, clawed_back]
        before:
          type: ["object", "null"]
          additionalProperties: true
        after:
          type: ["object", "null"]
          additionalProperties: true
        actor:
          type: string
        at:
          type: string

    DashboardSummary:
      type: object
      required: [tenantId, entryCount, accruedTotal, payableTotal, paidTotal, clawedBackTotal, totalsByState, totalsByType, topEarners]
      properties:
        tenantId:
          type: string
        entryCount:
          type: integer
        accruedTotal:
          type: number
        payableTotal:
          type: number
        paidTotal:
          type: number
        clawedBackTotal:
          type: number
        totalsByState:
          type: array
          items:
            $ref: "#/components/schemas/StateTotal"
        totalsByType:
          type: array
          items:
            $ref: "#/components/schemas/TypeTotal"
        topEarners:
          type: array
          items:
            $ref: "#/components/schemas/EarnerTotal"

    StateTotal:
      type: object
      required: [state, count, amount]
      properties:
        state:
          $ref: "#/components/schemas/CommissionState"
        count:
          type: integer
        amount:
          type: number

    TypeTotal:
      type: object
      required: [type, count, amount]
      properties:
        type:
          $ref: "#/components/schemas/CommissionType"
        count:
          type: integer
        amount:
          type: number

    EarnerTotal:
      type: object
      required: [personId, personName, amount, entryCount]
      properties:
        personId:
          type: string
        personName:
          type: string
        amount:
          type: number
        entryCount:
          type: integer

    ActivityItem:
      type: object
      required: [id, entryId, eventKind, actor, at, summary]
      properties:
        id:
          type: string
        entryId:
          type: string
        eventKind:
          type: string
        actor:
          type: string
        at:
          type: string
        summary:
          type: string
        personName:
          type: ["string", "null"]
        amount:
          type: ["number", "null"]

    PayrollLine:
      type: object
      required: [personId, personName, accruedTotal, payableTotal, paidTotal, netOwed, entryCount]
      properties:
        personId:
          type: string
        personName:
          type: string
        position:
          type: ["string", "null"]
        accruedTotal:
          type: number
        payableTotal:
          type: number
        paidTotal:
          type: number
        netOwed:
          type: number
        entryCount:
          type: integer

    ReconciliationMetrics:
      type: object
      description: Our engine-computed per-person totals.
      required: [netOwed, totalEarned, paid, adjustments]
      properties:
        netOwed:
          type: number
          description: Accrued + payable (matches the payroll Net Owed).
        totalEarned:
          type: number
          description: Sum of non-voided / non-clawed-back entry amounts.
        paid:
          type: number
          description: Sum of paid entry amounts.
        adjustments:
          type: number
          description: Sum of operator-originated adjustment dollars.

    ReconciliationNullableMetrics:
      type: object
      description: >-
        Per-metric values that may be absent. Used for benchmark figures (null
        when the source did not provide one) and deltas (null when there is no
        benchmark to subtract).
      required: [netOwed, totalEarned, paid, adjustments]
      properties:
        netOwed:
          type: ["number", "null"]
        totalEarned:
          type: ["number", "null"]
        paid:
          type: ["number", "null"]
        adjustments:
          type: ["number", "null"]

    ReconciliationMatchFlags:
      type: object
      description: >-
        Per-metric match indicator within the rounding tolerance. Null when
        there is no benchmark value for that metric (match is indeterminate).
      required: [netOwed, totalEarned, paid, adjustments]
      properties:
        netOwed:
          type: ["boolean", "null"]
        totalEarned:
          type: ["boolean", "null"]
        paid:
          type: ["boolean", "null"]
        adjustments:
          type: ["boolean", "null"]

    ReconciliationLine:
      type: object
      required:
        - personId
        - personName
        - inPeople
        - hasEntries
        - hasBenchmark
        - status
        - computed
        - benchmark
        - delta
        - match
      properties:
        personId:
          type: string
        personName:
          type: string
        inPeople:
          type: boolean
          description: Whether a people row exists for this person in our system.
        hasEntries:
          type: boolean
          description: Whether this person has any commission ledger entries.
        hasBenchmark:
          type: boolean
          description: Whether the source provided at least one benchmark value.
        status:
          type: string
          enum: [match, mismatch, no_benchmark]
        computed:
          $ref: "#/components/schemas/ReconciliationMetrics"
        benchmark:
          $ref: "#/components/schemas/ReconciliationNullableMetrics"
        delta:
          $ref: "#/components/schemas/ReconciliationNullableMetrics"
        match:
          $ref: "#/components/schemas/ReconciliationMatchFlags"

    ReconciliationRollup:
      type: object
      required:
        - peopleCount
        - matchCount
        - mismatchCount
        - noBenchmarkCount
        - computed
        - benchmark
      properties:
        peopleCount:
          type: integer
        matchCount:
          type: integer
        mismatchCount:
          type: integer
        noBenchmarkCount:
          type: integer
        computed:
          $ref: "#/components/schemas/ReconciliationMetrics"
        benchmark:
          $ref: "#/components/schemas/ReconciliationMetrics"

    ReconciliationReport:
      type: object
      required: [tenantId, tolerance, rollup, lines]
      properties:
        tenantId:
          type: string
        tolerance:
          type: number
          description: Absolute rounding tolerance used for the match indicator.
        rollup:
          $ref: "#/components/schemas/ReconciliationRollup"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/ReconciliationLine"

    RecomputeResult:
      type: object
      required: [tenantId, entriesCreated, entriesUpdated, entriesUnchanged, adjustmentsCreated, ranAt]
      properties:
        tenantId:
          type: string
        entriesCreated:
          type: integer
        entriesUpdated:
          type: integer
        entriesUnchanged:
          type: integer
        adjustmentsCreated:
          type: integer
        ranAt:
          type: string

    AirtableBase:
      type: object
      required: [id, name, permissionLevel]
      properties:
        id:
          type: string
        name:
          type: string
        permissionLevel:
          type: string

    AirtableField:
      type: object
      required: [id, name, type]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string

    AirtableTable:
      type: object
      required: [id, name, fields]
      properties:
        id:
          type: string
        name:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/AirtableField"

    SetAirtableBaseInput:
      type: object
      required: [baseId]
      properties:
        baseId:
          type: string

    SyncResult:
      type: object
      required: [tenantId, peopleUpserted, peopleRemoved, jobsUpserted, jobsRemoved, recompute, ranAt]
      properties:
        tenantId:
          type: string
        peopleUpserted:
          type: integer
        peopleRemoved:
          type: integer
        jobsUpserted:
          type: integer
        jobsRemoved:
          type: integer
        recompute:
          $ref: "#/components/schemas/RecomputeResult"
        ranAt:
          type: string
