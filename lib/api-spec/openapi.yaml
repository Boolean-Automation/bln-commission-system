openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Multi-tenant commission system API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tenants
    description: Tenant management
  - name: people
    description: Mirrored people records
  - name: jobs
    description: Mirrored job records
  - name: schema
    description: Tenant schema mapping
  - name: rules
    description: Rule module library and plans
  - name: commissions
    description: Commission ledger
  - name: insights
    description: Dashboard summaries and activity
  - name: manualInputs
    description: Manually-entered rep targets (quota, OTE, accelerators)
  - name: reports
    description: Reporting & analytics — leaderboard, breakdowns, spend, custom
  - name: rep-dashboard
    description: Sales-rep personal dashboard and display configuration
  - name: statements
    description: Per-period rep statements with human-readable formula breakdowns
  - name: Auth
    description: Browser and mobile authentication endpoints.
  - name: access
    description: User access and role management (RBAC)
paths:
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'
  /me:
    get:
      tags: [access]
      operationId: getAuthContext
      summary: Get the current user's roles, memberships, and accessible tenants
      responses:
        "200":
          description: Resolved RBAC context for the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthContext"
  /users:
    get:
      tags: [access]
      operationId: listUsers
      summary: List all authenticated users (platform operator only)
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuthUser"
        "403":
          $ref: "#/components/responses/Forbidden"
  /tenants/{tenantId}/members:
    get:
      tags: [access]
      operationId: listTenantMembers
      summary: List memberships for a tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Membership"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [access]
      operationId: createTenantMember
      summary: Assign a user as an admin or rep for the tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipInput"
      responses:
        "200":
          description: Created membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /tenants/{tenantId}/members/{membershipId}:
    patch:
      tags: [access]
      operationId: updateTenantMember
      summary: Update a membership's role or linked person
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/MembershipId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MembershipUpdate"
      responses:
        "200":
          description: Updated membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [access]
      operationId: deleteTenantMember
      summary: Remove a membership
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/MembershipId"
      responses:
        "200":
          description: Deleted membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMembershipResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /operators:
    get:
      tags: [access]
      operationId: listOperators
      summary: List Boolean operators (operator only)
      responses:
        "200":
          description: Platform operator memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Membership"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [access]
      operationId: createOperator
      summary: Grant a user Boolean Admin access (Boolean Super Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorInput"
      responses:
        "200":
          description: Created operator membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
  /operators/{membershipId}:
    delete:
      tags: [access]
      operationId: deleteOperator
      summary: Revoke a user's Boolean Admin access (Boolean Super Admin only)
      parameters:
        - $ref: "#/components/parameters/MembershipId"
      responses:
        "200":
          description: Deleted operator membership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteMembershipResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List all tenants
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create a new company (tenant)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenant"
      responses:
        "200":
          description: Created tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"

  /tenants/{tenantId}:
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Get a tenant by id
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Tenant detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateTenant
      tags: [tenants]
      summary: Rename a company (tenant)
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenant"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteTenant
      tags: [tenants]
      summary: Delete a company and all of its dependent data
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteTenantResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/dashboard:
    get:
      operationId: getDashboard
      tags: [insights]
      summary: Dashboard summary for a tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /tenants/{tenantId}/activity:
    get:
      operationId: getActivity
      tags: [insights]
      summary: Recent ledger activity for a tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 30
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ActivityItem"

  /tenants/{tenantId}/payroll:
    get:
      operationId: getPayrollSummary
      tags: [insights]
      summary: Payroll summary grouped by person
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Payroll summary lines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PayrollLine"

  /tenants/{tenantId}/reconciliation:
    get:
      operationId: getReconciliation
      tags: [insights]
      summary: Reconcile computed commission totals against the data-source benchmark
      description: >-
        Compares our engine-computed per-person commission totals (Net Owed,
        Total Earned, Paid, Adjustments) against the reference "benchmark"
        figures pulled from the tenant's data source. Benchmark values are
        reference-only and never feed the engine, ledger, dashboard, or payroll.
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Reconciliation report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReconciliationReport"

  /tenants/{tenantId}/people:
    get:
      operationId: listPeople
      tags: [people]
      summary: List mirrored people for a tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: People records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"

  /tenants/{tenantId}/jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List mirrored jobs for a tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Job records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /tenants/{tenantId}/manual-inputs:
    get:
      operationId: listManualInputs
      tags: [manualInputs]
      summary: List manual inputs (quota/OTE/targets) for a tenant and period
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: periodType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PeriodType"
        - name: periodKey
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Manual input records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualInput"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: upsertManualInput
      tags: [manualInputs]
      summary: Create or update a rep's manual input for a period
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualInputInput"
      responses:
        "200":
          description: Upserted manual input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualInput"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tenants/{tenantId}/manual-inputs/{manualInputId}:
    delete:
      operationId: deleteManualInput
      tags: [manualInputs]
      summary: Delete (clear) a rep's manual input
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ManualInputId"
      responses:
        "200":
          description: Deletion result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteManualInputResult"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/manual-inputs/{manualInputId}/events:
    get:
      operationId: getManualInputEvents
      tags: [manualInputs]
      summary: Audit history for a manual input
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/ManualInputId"
      responses:
        "200":
          description: Manual input audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualInputEvent"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/manual-input-variables:
    get:
      operationId: getManualInputVariables
      tags: [manualInputs]
      summary: Resolved manual-input named variables per person for a period
      description: >-
        Exposes manual inputs as named variables (quota, ote,
        acceleratorThreshold, acceleratorMultiplier) keyed by person, for the
        computation/dashboard layer to compute attainment and forecasts.
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: periodType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PeriodType"
        - name: periodKey
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Named variables per person
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ManualInputVariables"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tenants/{tenantId}/reports/leaderboard:
    get:
      operationId: getLeaderboard
      tags: [reports]
      summary: Rep performance leaderboard for a period
      description: >-
        Ranks reps by attainment vs quota for the chosen period. Numerator is
        the sum of commission entries credited via `accruedAt` within the
        period's effective range; denominator is the rep's quota from
        `manual_inputs`. Reps without a quota row are returned with
        `state="no_quota"` and excluded from ranking.
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: periodType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PeriodType"
        - name: periodKey
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Leaderboard rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardRow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tenants/{tenantId}/reports/breakdown:
    get:
      operationId: getBreakdown
      tags: [reports]
      summary: Performance broken down by a people attribute
      description: >-
        Groups reps by the chosen dimension and aggregates commission
        (accrual-dated) plus quota for the period. Null attribute values bucket
        into "Unassigned".
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: dimension
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/BreakdownDimension"
        - name: periodType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PeriodType"
        - name: periodKey
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Breakdown rows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BreakdownRow"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tenants/{tenantId}/reports/spend:
    get:
      operationId: getSpend
      tags: [reports]
      summary: Commission spend / liability over time
      description: >-
        Returns the commission liability composition (accrued / payable / paid
        / clawed-back / total) grouped by period, team, or person, dated by
        `paidAt` falling back to `payableAt` then `accruedAt`. Use to forecast
        cash and audit spend by cohort.
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: groupBy
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/SpendGroupBy"
        - name: periodType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PeriodType"
        - name: from
          in: query
          required: false
          schema:
            type: string
            description: Inclusive ISO date (YYYY-MM-DD)
        - name: to
          in: query
          required: false
          schema:
            type: string
            description: Inclusive ISO date (YYYY-MM-DD)
      responses:
        "200":
          description: Spend series
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SpendPoint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tenants/{tenantId}/reports/custom:
    post:
      operationId: runCustomReport
      tags: [reports]
      summary: Ad-hoc report from chosen dimensions + metrics
      description: >-
        Runs a tabular report with the dimensions and metrics selected by an
        admin. Result is capped server-side; the `truncated` flag indicates
        whether the cap was hit. Admin-only — operators of the tenant or
        platform staff.
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomReportRequest"
      responses:
        "200":
          description: Tabular report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomReportResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tenants/{tenantId}/rep-dashboard/me:
    get:
      operationId: getRepDashboardMe
      tags: [rep-dashboard]
      summary: Current rep dashboard summary for a period
      description: >-
        Returns a read-only dashboard summary for the authenticated rep. Staff
        users may pass `personId`; rep users are always scoped to the person id
        attached to their authenticated membership.
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: periodType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PeriodType"
        - name: periodKey
          in: query
          required: true
          schema:
            type: string
        - name: personId
          in: query
          required: false
          schema:
            type: string
          description: Staff-only override. Ignored for rep users.
      responses:
        "200":
          description: Rep dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepDashboardSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/rep-dashboard/kpi-config:
    get:
      operationId: getRepDashboardKpiConfig
      tags: [rep-dashboard]
      summary: Get configured KPI cards for rep dashboards
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: KPI display configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepDashboardKpiConfig"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      operationId: updateRepDashboardKpiConfig
      tags: [rep-dashboard]
      summary: Update configured KPI cards for rep dashboards
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepDashboardKpiConfigInput"
      responses:
        "200":
          description: Updated KPI display configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepDashboardKpiConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /tenants/{tenantId}/statements/me:
    get:
      operationId: getStatementForSelf
      tags: [statements]
      summary: Per-period commission statement for the authenticated rep
      description: >-
        Returns a human-readable statement for the authenticated rep covering
        the requested period. Staff callers must pass `personId`; rep callers
        are always scoped to the person id attached to their membership.
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: periodType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PeriodType"
        - name: periodKey
          in: query
          required: true
          schema:
            type: string
        - name: personId
          in: query
          required: false
          schema:
            type: string
          description: Staff-only override. Ignored for rep users.
      responses:
        "200":
          description: Statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/statements/{personId}:
    get:
      operationId: getStatementForPerson
      tags: [statements]
      summary: Per-period commission statement for a specific person
      description: >-
        Returns the statement for the named person. Admins/operators may
        request any person in the tenant; a rep may only request their own
        person id (server enforces).
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: personId
          in: path
          required: true
          schema:
            type: string
        - name: periodType
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/PeriodType"
        - name: periodKey
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Statement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/schema-mapping:
    get:
      operationId: getSchemaMapping
      tags: [schema]
      summary: Get the tenant's Airtable schema mapping
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Schema mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaMapping"
    put:
      operationId: updateSchemaMapping
      tags: [schema]
      summary: Update the tenant's Airtable schema mapping
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SchemaMappingInput"
      responses:
        "200":
          description: Updated schema mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaMapping"

  /tenants/{tenantId}/positions:
    get:
      operationId: listPositions
      tags: [positions]
      summary: List the tenant's configured positions
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Positions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Position"
    post:
      operationId: createPosition
      tags: [positions]
      summary: Add a position to the tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionInput"
      responses:
        "200":
          description: Created position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"
        "400":
          $ref: "#/components/responses/BadRequest"

  /tenants/{tenantId}/positions/{positionId}:
    patch:
      operationId: updatePosition
      tags: [positions]
      summary: Rename a position
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PositionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PositionInput"
      responses:
        "200":
          description: Updated position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Position"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deletePosition
      tags: [positions]
      summary: Delete a position
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/PositionId"
      responses:
        "200":
          description: Deleted position
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePositionResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /rule-modules:
    get:
      operationId: listRuleModules
      tags: [rules]
      summary: List the available rule modules in the library
      responses:
        "200":
          description: Rule module catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RuleModule"

  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: List the available data-source providers
      responses:
        "200":
          description: Data-source provider catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListProviders"

  /tenants/{tenantId}/plan:
    get:
      operationId: getActivePlan
      tags: [rules]
      summary: Get the tenant's active commission plan
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Active plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionPlan"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/rule-instances:
    post:
      operationId: createRuleInstance
      tags: [rules]
      summary: Add a rule instance to the tenant's plan (creating the plan if needed)
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInstanceCreate"
      responses:
        "200":
          description: Updated plan including the new rule instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionPlan"
        "400":
          $ref: "#/components/responses/BadRequest"

  /tenants/{tenantId}/rule-instances/reorder:
    post:
      operationId: reorderRuleInstances
      tags: [rules]
      summary: Set the order of rule instances within the tenant's plan
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRuleInstances"
      responses:
        "200":
          description: Updated plan in the new order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionPlan"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /rule-instances/{ruleInstanceId}:
    patch:
      operationId: updateRuleInstance
      tags: [rules]
      summary: Update a rule instance's params or enabled state
      parameters:
        - name: ruleInstanceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInstanceUpdate"
      responses:
        "200":
          description: Updated rule instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleInstance"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      operationId: deleteRuleInstance
      tags: [rules]
      summary: Remove a rule instance from its plan
      parameters:
        - name: ruleInstanceId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Rule instance removed
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/recompute:
    post:
      operationId: recomputeCommissions
      tags: [commissions]
      summary: Run a full commission computation pass for the tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Recompute result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecomputeResult"

  /airtable/bases:
    get:
      operationId: listAirtableBases
      tags: [airtable]
      summary: List Airtable bases reachable through the connection
      responses:
        "200":
          description: Bases
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AirtableBase"
        "502":
          $ref: "#/components/responses/BadRequest"

  /airtable/bases/{baseId}/tables:
    get:
      operationId: getAirtableTables
      tags: [airtable]
      summary: List the tables and fields of an Airtable base
      parameters:
        - name: baseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AirtableTable"
        "502":
          $ref: "#/components/responses/BadRequest"

  /tenants/{tenantId}/airtable-base:
    put:
      operationId: setAirtableBase
      tags: [airtable]
      summary: Point the tenant at an Airtable base
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAirtableBaseInput"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          $ref: "#/components/responses/NotFound"

  /tenants/{tenantId}/sync:
    post:
      operationId: syncFromAirtable
      tags: [airtable]
      summary: Pull people and jobs from Airtable, then recompute
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"
        "400":
          $ref: "#/components/responses/BadRequest"

  /tenants/{tenantId}/commissions:
    get:
      operationId: listCommissions
      tags: [commissions]
      summary: List commission ledger entries for a tenant
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - name: state
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CommissionState"
        - name: type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/CommissionType"
        - name: personId
          in: query
          required: false
          schema:
            type: string
        - name: search
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Commission entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommissionEntry"

  /commissions/{entryId}:
    get:
      operationId: getCommission
      tags: [commissions]
      summary: Get a single commission entry
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: Commission entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionEntry"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: adjustCommission
      tags: [commissions]
      summary: Adjust a commission entry amount or notes
      parameters:
        - $ref: "#/components/parameters/EntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionAdjustment"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionEntry"
        "404":
          $ref: "#/components/responses/NotFound"

  /commissions/{entryId}/transition:
    post:
      operationId: transitionCommission
      tags: [commissions]
      summary: Transition a commission entry to a new lifecycle state
      parameters:
        - $ref: "#/components/parameters/EntryId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommissionTransition"
      responses:
        "200":
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommissionEntry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /commissions/{entryId}/events:
    get:
      operationId: getCommissionEvents
      tags: [commissions]
      summary: Get the audit log for a commission entry
      parameters:
        - $ref: "#/components/parameters/EntryId"
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommissionEvent"

components:
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
    EntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
    PositionId:
      name: positionId
      in: path
      required: true
      schema:
        type: string
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
    ManualInputId:
      name: manualInputId
      in: path
      required: true
      schema:
        type: string
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Operation not permitted
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string

    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    MembershipRole:
      type: string
      enum: [super_operator, platform_operator, admin, rep]

    Membership:
      type: object
      required: [id, userId, role, tenantId, personId, createdAt]
      properties:
        id:
          type: string
        userId:
          type: string
        role:
          $ref: "#/components/schemas/MembershipRole"
        tenantId:
          type: [string, 'null']
        personId:
          type: [string, 'null']
        createdAt:
          type: string
        userEmail:
          type: [string, 'null']
        userName:
          type: [string, 'null']
        personName:
          type: [string, 'null']

    MembershipInput:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
        role:
          type: string
          enum: [admin, rep]
        personId:
          type: [string, 'null']

    MembershipUpdate:
      type: object
      properties:
        role:
          type: string
          enum: [admin, rep]
        personId:
          type: [string, 'null']

    OperatorInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: string

    DeleteMembershipResult:
      type: object
      required: [id, deleted]
      properties:
        id:
          type: string
        deleted:
          type: boolean

    AccessibleTenant:
      type: object
      required: [id, name, slug, role]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        role:
          $ref: "#/components/schemas/MembershipRole"

    AuthContext:
      type: object
      required:
        [
          user,
          isSuperOperator,
          isPlatformOperator,
          memberships,
          accessibleTenants,
        ]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
        isSuperOperator:
          type: boolean
        isPlatformOperator:
          type: boolean
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/Membership"
        accessibleTenants:
          type: array
          items:
            $ref: "#/components/schemas/AccessibleTenant"

    Position:
      type: object
      required: [id, tenantId, name, createdAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        createdAt:
          type: string

    PositionInput:
      type: object
      required: [name]
      properties:
        name:
          type: string

    DeletePositionResult:
      type: object
      required: [id, deleted]
      properties:
        id:
          type: string
        deleted:
          type: boolean

    PeriodType:
      type: string
      enum: [monthly, quarterly, annual]

    ManualInput:
      type: object
      required: [id, tenantId, personId, periodType, periodKey, effectiveFrom, effectiveTo, createdAt, updatedAt]
      properties:
        id:
          type: string
        tenantId:
          type: string
        personId:
          type: string
        periodType:
          $ref: "#/components/schemas/PeriodType"
        periodKey:
          type: string
        quota:
          type: ["number", "null"]
        ote:
          type: ["number", "null"]
        acceleratorThreshold:
          type: ["number", "null"]
        acceleratorMultiplier:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]
        effectiveFrom:
          type: string
        effectiveTo:
          type: string
        updatedBy:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    ManualInputInput:
      type: object
      required: [personId, periodType, periodKey]
      properties:
        personId:
          type: string
        periodType:
          $ref: "#/components/schemas/PeriodType"
        periodKey:
          type: string
        quota:
          type: ["number", "null"]
        ote:
          type: ["number", "null"]
        acceleratorThreshold:
          type: ["number", "null"]
        acceleratorMultiplier:
          type: ["number", "null"]
        notes:
          type: ["string", "null"]

    DeleteManualInputResult:
      type: object
      required: [id, deleted]
      properties:
        id:
          type: string
        deleted:
          type: boolean

    ManualInputVariables:
      type: object
      required: [personId, personName]
      properties:
        personId:
          type: string
        personName:
          type: string
        quota:
          type: ["number", "null"]
        ote:
          type: ["number", "null"]
        acceleratorThreshold:
          type: ["number", "null"]
        acceleratorMultiplier:
          type: ["number", "null"]

    BreakdownDimension:
      type: string
      enum: [region, cohort, team, position]

    SpendGroupBy:
      type: string
      enum: [period, team, person]

    ReportDimension:
      type: string
      enum: [person, region, cohort, team, position, period, entryType, state]

    ReportMetric:
      type: string
      enum:
        - commissionTotal
        - entryCount
        - quotaAttainmentPct
        - paidAmount
        - accruedAmount
        - payableAmount
        - clawedBackAmount
        - spendAmount

    LeaderboardState:
      type: string
      enum: [over, on_track, under, no_quota]

    LeaderboardRow:
      type: object
      required: [personId, personName, earnedInPeriod, state]
      properties:
        rank:
          type: ["integer", "null"]
        personId:
          type: string
        personName:
          type: string
        position:
          type: ["string", "null"]
        region:
          type: ["string", "null"]
        cohort:
          type: ["string", "null"]
        team:
          type: ["string", "null"]
        quota:
          type: ["number", "null"]
        ote:
          type: ["number", "null"]
        earnedInPeriod:
          type: number
        attainmentPct:
          type: ["number", "null"]
        deltaToQuota:
          type: ["number", "null"]
        state:
          $ref: "#/components/schemas/LeaderboardState"

    KpiKey:
      type: string
      enum:
        - earnedInPeriod
        - attainmentPct
        - rank
        - projectedEarning
        - quota
        - ote
        - accrued
        - payable
        - paid
        - deltaToQuota

    CommissionByState:
      type: object
      required: [accrued, payable, paid, clawedBack]
      properties:
        accrued:
          type: number
        payable:
          type: number
        paid:
          type: number
        clawedBack:
          type: number

    RepProjection:
      type: object
      required: [projectedEarning, paceVsQuota, daysElapsed, daysRemaining]
      properties:
        projectedEarning:
          type: number
        paceVsQuota:
          type: ["number", "null"]
        daysElapsed:
          type: integer
        daysRemaining:
          type: integer

    RepDashboardSummary:
      type: object
      required:
        - personId
        - personName
        - period
        - commissionByState
        - quota
        - ote
        - earnedInPeriod
        - attainmentPct
        - deltaToQuota
        - rank
        - peerCount
        - state
        - projection
        - enabledKpis
      properties:
        personId:
          type: string
        personName:
          type: string
        period:
          type: object
          required: [type, key]
          properties:
            type:
              $ref: "#/components/schemas/PeriodType"
            key:
              type: string
        commissionByState:
          $ref: "#/components/schemas/CommissionByState"
        quota:
          type: ["number", "null"]
        ote:
          type: ["number", "null"]
        earnedInPeriod:
          type: number
        attainmentPct:
          type: ["number", "null"]
        deltaToQuota:
          type: ["number", "null"]
        rank:
          type: ["integer", "null"]
        peerCount:
          type: integer
        state:
          $ref: "#/components/schemas/LeaderboardState"
        projection:
          $ref: "#/components/schemas/RepProjection"
        enabledKpis:
          type: array
          items:
            $ref: "#/components/schemas/KpiKey"

    RepDashboardKpiConfig:
      type: object
      required: [enabledKpis, updatedAt]
      properties:
        enabledKpis:
          type: array
          items:
            $ref: "#/components/schemas/KpiKey"
        updatedAt:
          type: ["string", "null"]

    RepDashboardKpiConfigInput:
      type: object
      required: [enabledKpis]
      properties:
        enabledKpis:
          type: array
          items:
            $ref: "#/components/schemas/KpiKey"

    FormulaInput:
      type: object
      required: [label, value]
      properties:
        label:
          type: string
        value:
          type: string

    FormulaBreakdown:
      type: object
      required: [expression, inputs, gated, gateReason]
      properties:
        expression:
          type: string
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/FormulaInput"
        gated:
          type: boolean
        gateReason:
          type: ["string", "null"]

    StatementDeal:
      type: object
